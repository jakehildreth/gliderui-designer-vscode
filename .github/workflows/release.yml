name: Release

# Tag push drives a full release: the tag is the version (CalVer: vYYYY.M.DHHMM,
# e.g. v2026.11.251430). A push to main instead creates a prerelease tagged
# vYYYY.M.DHHMM-pre; prereleases accumulate until a full release deletes them.
# Both stamp the version into package.json, build the .vsix, and attach it to a
# GitHub Release. Marketplace publishing happens only for full releases and only
# when VSCE_PAT exists.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist, e.g. v2026.11.251430)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with designer submodule)
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "version=$(date -u +%Y.%-m.%d%H%M)-pre" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_ENV"
          else
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_ENV"
            echo "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{5,6}$' || {
              echo "::error::Tag '$TAG' is not CalVer vYYYY.M.DHHMM"
              exit 1
            }
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run compile

      - name: Stamp CalVer version into package.json
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        env:
          VERSION: ${{ env.version }}

      - name: Package .vsix
        run: npx @vscode/vsce package --out gliderui-designer-vscode-${{ env.version }}.vsix

      - name: GitHub Release with .vsix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: ${{ env.version }}
          files: gliderui-designer-vscode-${{ env.version }}.vsix
          prerelease: ${{ env.prerelease }}
          generate_release_notes: ${{ env.prerelease != 'true' }}
          body: |
            Visual designer for cross-platform PowerShell GUIs (GliderUI/Avalonia), wrapping the [GUI Creator](https://github.com/Mynster9361/guiCreatorPowerShell) designer.

            Install: download the .vsix below, then `code --install-extension gliderui-designer-vscode-${{ env.version }}.vsix` or Extensions view → ... → Install from VSIX.

            Requires PowerShell 7.4+ (`pwsh` on PATH) and the [GliderUI](https://github.com/mdgrs-mei/GliderUI) module to run designs (F5).

      - name: Delete accumulated prereleases on full release
        if: env.prerelease != 'true'
        run: |
          gh release list --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | while read -r tag; do
                gh release delete "$tag" --yes --cleanup-tag
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != '' && env.prerelease != 'true'
        run: npx @vscode/vsce publish -p "$VSCE_PAT" --packagePath gliderui-designer-vscode-${{ env.version }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
